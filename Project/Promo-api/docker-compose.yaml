version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_lb
    ports:
      - '8081:80'
    depends_on:
      - app1
      - app2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - app_network

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_app1
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: fahad
      DATABASE_PASSWORD: fahad1234
      DATABASE_NAME: nestjs
    expose:
      - '3000'
    networks:
      - app_network
    depends_on:
      - postgres

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_app2
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: fahad
      DATABASE_PASSWORD: fahad1234
      DATABASE_NAME: nestjs
    expose:
      - '3000'
    networks:
      - app_network
    depends_on:
      - postgres

  postgres:
    image: postgres:14-alpine
    container_name: nestjs_postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fahad
      POSTGRES_PASSWORD: fahad1234
      POSTGRES_DB: nestjs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
